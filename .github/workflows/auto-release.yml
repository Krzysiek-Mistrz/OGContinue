name: Create Automatic Release

# this fork tags directly on main when a version is ready to ship, as og-vX.Y.Z 
# the old trigger here (a branch + a Mon/Wed/Fri cron) was upstream Continue -> was refactored

on:
  push:
    tags:
      - "og-v*"
  workflow_dispatch: # Keep manual trigger option

jobs:
  create-vscode-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating releases

    steps:
      - uses: actions/checkout@v4

      - name: Get release name
        id: get_version
        run: |
          # Use the tag that was actually pushed when triggered that way;
          # fall back to deriving one from package.json for a manual workflow_dispatch run
          if [ "${{ github.ref_type }}" = "tag" ]; then
            new_version="${{ github.ref_name }}"
          else
            version=$(node -p "require('./extensions/vscode/package.json').version")
            new_version="og-v${version}"
          fi
          echo "New version will be: $new_version"
          echo "NEW_VERSION=$new_version" >> $GITHUB_ENV

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$NEW_VERSION" \
            --generate-notes \
            --title "$NEW_VERSION" \
            --latest
